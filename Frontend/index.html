<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECOGNITA - Text Recognition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>
<body>
    <!-- Navbar -->
    <header>
        <h1>R.E.C.O.G.N.I.T.A</h1>
    </header>

    <!-- Main Section -->
    <main>
        <!-- Dark Mode Toggle -->
        <button id="dark-mode-btn">
            <i class="fas fa-moon"></i> <!-- Font Awesome moon icon (you can replace with a sun icon for light mode) -->
            Toggle Dark Mode
        </button>

        <div class="upload-container">
            <label for="file-input" class="upload-label">Upload Image</label>
            <input type="file" id="file-input" accept="image/*" multiple>
        </div>

        <div id="preview-container"></div>
        <button id="process-btn">Process Image</button>

        <select id="language-selector"></select>
        <textarea id="output-text" readonly placeholder="Extracted text will appear here..."></textarea>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 RECOGNITA</p>
    </footer>

    <!-- Scripts -->
    <script type="module">
        import { showProgressIndicator, hideProgressIndicator } from './functions/progressIndicator.js';
        import { handleMultipleUploads } from './functions/multipleUpload.js';
        import { createLanguageSelector, getSelectedLanguage } from './functions/languageSelector.js';
        import { downloadText } from './functions/downloadText.js';
        import { saveResult } from './functions/saveResults.js';
        import { showError } from './functions/errorHandling.js';
        import { toggleDarkMode, initializeDarkMode } from './functions/darkMode.js';

        // Initialize Dark Mode
        initializeDarkMode();

        // Add event listeners and functionality
        document.getElementById('file-input').addEventListener('change', handleMultipleUploads);
        document.getElementById('process-btn').addEventListener('click', async () => {
            showProgressIndicator();
            try {
                // Process the image and get the text
                const language = getSelectedLanguage();
                const text = 'Sample extracted text'; // Replace with actual API call

                // Save the results
                saveResult(text);

                // Display the extracted text
                document.getElementById('output-text').value = text;
            } catch (error) {
                showError('An error occurred while processing the image.');
            } finally {
                hideProgressIndicator();
            }
        });

        // Add language selector to the page
        document.getElementById('language-selector').appendChild(createLanguageSelector());

        // Dark mode toggle
        document.getElementById('dark-mode-btn').addEventListener('click', toggleDarkMode);
    </script>
</body>
</html>

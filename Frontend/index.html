<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECOGNITA - Text Recognition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <h1>RECOGNITA</h1>
    </header>

    <!-- Main Section -->
    <main>
        <div class="upload-container">
            <label for="file-input" class="upload-label">Upload Image</label>
            <input type="file" id="file-input" accept="image/*">
        </div>
        <img id="preview" src="" alt="Image Preview" style="display:none;">
        <button id="process-btn">Process Image</button>
        <textarea id="output-text" readonly placeholder="Extracted text will appear here..."></textarea>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 RECOGNITA</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
